version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # typescript-eslint does not support TypeScript 7 yet.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep @types/node on the runtime Node major. Ignore majors so
      # Dependabot does not bump typings past the Node version we run.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
